name: Check Project

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repository
        run: |
          echo "=== CURRENT DIRECTORY ==="
          pwd
          echo
          echo "=== ALL FILES ==="
          find . -type f | sort

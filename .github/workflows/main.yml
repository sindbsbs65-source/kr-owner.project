name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show project files
        run: |
          echo "=== FILES ==="
          find . -maxdepth 5 -type f | sort | head -300

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Find Android project
        id: find_project
        shell: bash
        run: |
          DIR=$(find . -type f -name "build.gradle" -o -name "build.gradle.kts" | while read f; do
            if grep -q "com.android.application" "$f" 2>/dev/null; then
              dirname "$f"
              break
            fi
          done)

          if [ -z "$DIR" ]; then
            echo "Android project not found"
            exit 1
          fi

          echo "Android project: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: ${{ steps.find_project.outputs.dir }}
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KR-Owner-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
